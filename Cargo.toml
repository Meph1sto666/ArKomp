[package]
name = "arkomp"
version = "0.1.0"
edition = "2024"

[dependencies]
libloading = "0.9.0"
shared = { path = "shared/" }
serde.workspace = true
eframe.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
tungstenite = "0.29.0"
tokio-tungstenite = "0.29.0"
futures-util = "0.3.31"
futures = "0.3.31"

[dev-dependencies]
rstest = "0.26.1"
test-case = "3.3.1"

[workspace]
members = ["shared"]

[workspace.dependencies]
eframe = "0.34.2"
serde = { version = "1.0.226", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
serde_json = "1.0.145"
